[package]
name = "p2-nnue"
version = "0.1.0"
edition = "2024"
description = "P2 NNUE evaluation network (2048→512→256→1)"

[features]
default = []
cuda = ["dep:cc"]
# Policy-Value GPU 推論 (bullet 互換、 cudarc 直接利用)
pv-cuda = ["dep:cudarc"]

[dependencies]
rshogi-core = { path = "../rshogi-core", default-features = false }
cudarc = { version = "=0.17.3", features = ["cuda-version-from-build-system", "cublas"], optional = true }

[build-dependencies]
cc = { version = "1.0", optional = true, features = ["parallel"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "p2_nnue"
path = "src/lib.rs"
