[package]
name = "rshogi-usi"
version = "0.1.0"
edition = "2024"
authors = ["SH11235"]
description = "USI protocol implementation for rshogi engine"
license = "GPL-3.0-only"
repository = "https://github.com/sh11235/rshogi"
keywords = ["shogi", "usi", "japanese-chess", "engine", "protocol"]
categories = ["games", "game-engines"]
readme = "README.md"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true

# Local dependencies
rshogi-core = { version = "0.2", path = "../rshogi-core", default-features = false }
p2-search = { path = "../p2-search" }
# Midgame policy hook (default は cpu feature のみ、 transformer-runtime adapter は別 build profile で)
p2-midgame-policy = { path = "../p2-midgame-policy", default-features = false, features = ["cpu"] }
# PUCT hybrid 用 NNUE evaluator trait と P2NnueInput 型 (puct-hybrid feature 経路のみで参照)
p2-nnue = { path = "../p2-nnue" }

[features]
default = ["search-no-pass-rules", "layerstacks-1536x16x32"]
search-no-pass-rules = ["rshogi-core/search-no-pass-rules"]
# 探索統計収集（枝刈り発生回数等のカウント）
search-stats = ["rshogi-core/search-stats"]
# NNUE統計収集（refresh/update比率等のカウント）
nnue-stats = ["rshogi-core/nnue-stats"]
# TT書き込みトレースおよびhelper bound/depthフィルタ
tt-trace = ["rshogi-core/tt-trace"]
# LayerStack 専用ビルド（大会向け production 用）
layerstack-only = ["rshogi-core/layerstack-only"]
# NNUE 詳細診断ログ（Golden Forward テスト用）
diagnostics = ["rshogi-core/diagnostics"]
# NNUE PSQT ショートカット対応
nnue-psqt = ["rshogi-core/nnue-psqt"]
# NNUE Pin-aware 補助特徴量対応 (2026-05-24 追加)
# pin/skewer 状態を 81 × 14 × 2 = 2,268 dim per perspective の sparse feature で
# encode。 詳細は crates/rshogi-core/src/nnue/pin_features.rs 参照。
nnue-pin-aware = ["rshogi-core/nnue-pin-aware"]
# NNUE Dual PSQT 領域確保 (Plan C iter 2 用、 2026-05-25 追加)
# iter 1 では Zeroed init で eval 寄与 0、 iter 2 で head-only fine-tune。
# 詳細は crates/rshogi-core/src/nnue/dual_psqt.rs 参照。
nnue-dual-psqt = ["rshogi-core/nnue-dual-psqt"]
# NNUE KingRing Threat PSQT scalar head (arm 11、 2026-05-28 追加)
nnue-kingring-psqt = ["rshogi-core/nnue-kingring-psqt"]
# NNUE Piece-Pair Shape PSQT scalar head (arm 12、 2026-05-29 追加)
nnue-pairshape-psqt = ["rshogi-core/nnue-pairshape-psqt"]
# Activity-Risk Interaction Head (2026-06-06)
nnue-activity-risk-psqt = ["rshogi-core/nnue-activity-risk-psqt"]
# King Escape Direction PSQT scalar head (2026-06-09)
nnue-king-escape-psqt = ["rshogi-core/nnue-king-escape-psqt"]
# King Danger (KDGR) PSQT scalar head (2026-06-15)
nnue-king-danger-psqt = ["rshogi-core/nnue-king-danger-psqt"]
# Attack Development (ADEV) PSQT scalar head (2026-06-16)
nnue-attack-dev-psqt = ["rshogi-core/nnue-attack-dev-psqt"]
# Slider X-ray (SXRY) PSQT scalar head (2026-06-28)
nnue-slider-xray-psqt = ["rshogi-core/nnue-slider-xray-psqt"]
# King Zone Threat (KZT) sparse PSQT-like head (2026-06-30、 骨組み v0)
nnue-kzt-psqt = ["rshogi-core/nnue-kzt-psqt"]
# King Zone Threat FT 入力版 (KZT-FT、 2026-07-03。 nnue-kzt-psqt と相互排他)
nnue-kzt-ft = ["rshogi-core/nnue-kzt-ft"]
# Optimism Damp Head (ODH) v0 (2026-07-02、 解析注入 hand-set 版)
nnue-odh = ["rshogi-core/nnue-odh"]
# Eval Bias Correction (EBC) = correction-history 型の静的評価補正 (2026-07-03)
nnue-eval-bias-corr = ["rshogi-core/nnue-eval-bias-corr"]
# King Mobility (KMOB) PSQT scalar head (2026-06-16)
nnue-king-mobility-psqt = ["rshogi-core/nnue-king-mobility-psqt"]
# Drop Pressure (DROP) PSQT scalar head (2026-06-16)
nnue-drop-pressure-psqt = ["rshogi-core/nnue-drop-pressure-psqt"]
# Attack Relay Head (ARH) scalar head (2026-06-09)
nnue-attack-relay = ["rshogi-core/nnue-attack-relay"]
# Attack Relay Head v2 (= A5 仕様、 2026-06-10)
nnue-attack-relay-v2 = ["rshogi-core/nnue-attack-relay-v2"]
# NNUE Threat 特徴量対応
nnue-threat = ["rshogi-core/nnue-threat"]
nnue-scalar-threat = ["rshogi-core/nnue-scalar-threat"]
nnue-scalar-threat-coexist = [
    "nnue-scalar-threat",
    "rshogi-core/nnue-scalar-threat-coexist",
]
nnue-dual-cross-geometry = [
    "nnue-dual-psqt",
    "rshogi-core/nnue-dual-cross-geometry",
]
# Threat exclusion profiles
threat-profile-same-class = ["rshogi-core/threat-profile-same-class"]
threat-profile-same-class-major-pawn = ["rshogi-core/threat-profile-same-class-major-pawn"]
# NNUE progress8kpabs 差分更新最適化（L1=1536 で有効、L1=768 で退行）
nnue-progress-diff = ["rshogi-core/nnue-progress-diff"]
# NNUE lazy-evaluate: TT hit && !PvNode で ttData.eval 再利用、 +2.41% NPS (eager よりも棋力 risk あり)
use-lazy-evaluate = ["rshogi-core/use-lazy-evaluate"]
# lazy-eval-guard: type-1 (key16) 衝突ガード付き lazy-evaluate（use-lazy-evaluate と組み合わせ）
lazy-eval-guard = ["rshogi-core/lazy-eval-guard"]
# PUCT hybrid engine (序中盤 PUCT + 終盤 αβ、 default off)
# 有効時に USI option `UsePuct=true` で hybrid 経路に切替可能。
# NNUE-B Transformer 未訓練のため現在は stub policy + value=0、 strong play は別 session で実装。
puct-hybrid = []
# LayerStacks exact architecture / L1 バリアント
layerstacks-1536x16x32 = ["rshogi-core/layerstacks-1536x16x32"]
layerstacks-1536x32x32 = ["rshogi-core/layerstacks-1536x32x32"]
layerstacks-1536x8x96 = ["rshogi-core/layerstacks-1536x8x96"]
layerstacks-1024x8x64 = ["rshogi-core/layerstacks-1024x8x64"]
layerstacks-1536x16x96 = ["rshogi-core/layerstacks-1536x16x96"]
layerstacks-1536x32x96 = ["rshogi-core/layerstacks-1536x32x96"]
layerstacks-1536x16x48 = ["rshogi-core/layerstacks-1536x16x48"]
layerstacks-1536x48x96 = ["rshogi-core/layerstacks-1536x48x96"]
layerstacks-768x32x96 = ["rshogi-core/layerstacks-768x32x96"]
layerstacks-1536x64x96 = ["rshogi-core/layerstacks-1536x64x96"]
nnue-int8-runtime = ["rshogi-core/nnue-int8-runtime"]
# 2026-05-17: FT full INT8 (fused path も i8 経由化)
nnue-int8-full = ["rshogi-core/nnue-int8-full"]
layerstacks-768x16x32 = ["rshogi-core/layerstacks-768x16x32"]
layerstacks-768x8x32 = ["rshogi-core/layerstacks-768x8x32"]
layerstacks-512x16x32 = ["rshogi-core/layerstacks-512x16x32"]
# HalfKAv2_hm 入力 (Stockfish 14 PR #3506 準拠、 2026-05-17 P5 実装)
halfkav2-hm = ["rshogi-core/halfkav2-hm"]

[[bin]]
name = "rshogi-usi"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.0"
serial_test = "3"
