[package]
name = "p2-transformer-runtime"
version = "0.1.0"
edition = "2024"
description = "Hybrid (CPU/GPU) inference runtime for the p2 Transformer + PUCT engine"
publish = false

[features]
default = ["cpu"]
cpu = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
p2-transformer = { path = "../p2-transformer" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lib]
name = "p2_transformer_runtime"
path = "src/lib.rs"

[[bench]]
name = "cpu_inference"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "avx2_breakdown"
harness = false
